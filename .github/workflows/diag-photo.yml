name: 사진 진단(임시)
on:
  push:
    branches: [diag/photo-check]
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          declare -A URLS=(
            [M048]='http://jejusuchang.com/data/file/3_1_1_1/_thumb/600x_100/3552705081_Mlbvdf4o_EC97ACECA3BC111.jpg'
            [M090]='http://jejusuchang.com/data/file/3_2_1_1/_thumb/600x_100/3552705081_syd21HTA_2.jpg'
          )
          for mid in M048 M090; do
            u="${URLS[$mid]}"
            echo "===== $mid ====="
            echo -n "기본 요청: ";            curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}B\n' -L --max-time 30 "$u"
            echo -n "브라우저 UA: ";          curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}B\n' -L --max-time 30 -A "$UA" "$u"
            echo -n "브라우저 UA+Referer: ";  curl -s -o "/tmp/$mid.jpg" -w '%{http_code} %{content_type} %{size_download}B\n' -L --max-time 30 -A "$UA" -e 'http://jejusuchang.com/' "$u"
            echo -n "https 기본: ";           curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}B\n' -L --max-time 30 "${u/http:/https:}"
            if [ -s "/tmp/$mid.jpg" ] && file "/tmp/$mid.jpg" | grep -q image; then
              echo "BEGIN_B64 $mid"; base64 -w0 "/tmp/$mid.jpg"; echo; echo "END_B64 $mid"
            else
              echo "이미지 아님:"; head -c 300 "/tmp/$mid.jpg" 2>/dev/null; echo
            fi
          done
